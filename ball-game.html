<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шарики в круге</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px; /* Уменьшили отступы для мобильных */
        }
        .game-container {
            display: flex;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
            height: auto; /* Позволяем контейнеру подстраиваться под высоту элементов */
        }
        .game-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
        }
        #gameCanvas {
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
            background: #0a0a0a;
            border: 2px solid #0f0;
            max-width: 100%; /* Холст сжимается по ширине экрана */
            height: auto;    /* Пропорции холста сохраняются */
            aspect-ratio: 7 / 6; /* Фиксируем пропорцию 700х600 */
        }
        .start-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            width: 90%;
        }
        .start-overlay h2 {
            color: #0f0;
            font-size: 24px; /* Чуть уменьшили для мобильных */
            text-shadow: 0 0 20px #0f0;
        }
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f00;
            font-size: 24px;
            font-weight: bold;
            display: none;
            text-shadow: 0 0 10px #f00;
        }
        .settings-panel {
            width: 280px;
            background: #0a0a0a;
            border: 2px solid #0f0;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
            display: flex;
            flex-direction: column;
            flex-shrink: 0; /* Панель не сжимается на ПК */
        }
        .settings-panel h3 {
            color: #0f0;
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #0f0;
            padding-bottom: 10px;
            font-size: 18px;
        }
        .setting-group { margin-bottom: 12px; }
        .setting-group label {
            color: #0f0;
            font-size: 12px;
            display: block;
            margin-bottom: 3px;
        }
        .setting-group input[type="range"] {
            width: 100%;
            accent-color: #0f0;
        }
        .setting-group span { color: #fff; font-weight: bold; }
        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #0f0;
            font-size: 12px;
        }
        .checkbox-label input {
            margin-right: 6px;
            accent-color: #0f0;
        }
        .stats {
            background: #0a0a0a;
            border: 1px solid #0f0;
            border-radius: 5px;
            padding: 10px;
            margin: 10px 0;
        }
        .stats p { margin: 4px 0; color: #0f0; font-size: 11px; }
        .stats strong { color: #fff; }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }
        button {
            padding: 12px; /* Увеличили для удобного нажатия пальцем */
            border: 1px solid #0f0;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }
        .btn-start { background: #0f0; color: #000; }
        .btn-start:hover { background: #000; color: #0f0; box-shadow: 0 0 20px #0f0; }
        .btn-pause { background: #0a0a0a; color: #0f0; }
        .btn-pause:hover { background: #0f0; color: #000; }
        .btn-add { background: #0a0a0a; color: #0f0; }
        .btn-add:hover { background: #0f0; color: #000; }
        .btn-reset { background: #0a0a0a; color: #0f0; }
        .btn-reset:hover { background: #0f0; color: #000; }
        .btn-back { background: #0a0a0a; color: #f00; border-color: #f00; }
        .btn-back:hover { background: #f00; color: #000; }

        /* АДАПТИВНОСТЬ ДЛЯ СМАРТФОНОВ И ПЛАНШЕТОВ */
        @media (max-width: 850px) {
            body {
                align-items: flex-start; /* Разрешаем скролл сверху вниз на телефонах */
                overflow-y: auto;
            }
            .game-container {
                flex-direction: column; /* Элементы встают друг под друга */
                height: auto;
                gap: 15px;
            }
            .settings-panel {
                width: 100%; /* Панель настроек растягивается во всю ширину */
            }
            .buttons {
                display: grid;
                grid-template-columns: 1fr 1fr; /* Кнопки теперь в два ряда, чтобы экономить место */
                gap: 10px;
                margin-top: 15px;
            }
            .btn-back {
                grid-column: span 2; /* Кнопка Назад растягивается на всю ширину внизу */
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-area">
            <canvas id="gameCanvas" width="700" height="600"></canvas>
            <div class="start-overlay" id="startOverlay">
                <h2>🎮 НАЖМИТЕ "СТАРТ"</h2>
            </div>
            <div class="game-over" id="gameOver">ИГРА ОКОНЧЕНА!</div>
        </div>
        
        <div class="settings-panel">
            <h3>🎮 НАСТРОЙКИ</h3>
            
            <div class="setting-group">
                <label>ШАРОВ: <span id="ballCountValue">5</span></label>
                <input type="range" id="ballCount" min="2" max="12" value="5" step="1">
            </div>
            
            <div class="setting-group">
                <label>РАЗМЕР: <span id="ballSizeValue">15</span></label>
                <input type="range" id="ballSize" min="5" max="30" value="15" step="1">
            </div>
            
            <div class="setting-group">
                <label>СКОРОСТЬ: <span id="baseSpeedValue">2</span></label>
                <input type="range" id="baseSpeed" min="1" max="10" value="2" step="0.5">
            </div>
            
            <div class="setting-group">
                <label>ПРИРОСТ: <span id="speedIncrementValue">0.15</span></label>
                <input type="range" id="speedIncrement" min="0.01" max="0.5" value="0.15" step="0.01">
            </div>
            
            <div class="setting-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="showTrails" checked>
                    СЛЕДЫ
                </label>
            </div>
            
            <div class="setting-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="collisionBetweenBalls" checked>
                    СТОЛКНОВЕНИЯ
                </label>
            </div>
            
            <div class="stats">
                <p>АКТИВНЫХ: <strong id="aliveBalls">5</strong></p>
                <p>СЛЕДОВ: <strong id="totalTrails">0</strong></p>
                <p>ВРЕМЯ: <strong id="gameTime">0:00</strong></p>
                <p>СТАТУС: <strong id="gameStatus">НЕ НАЧАТА</strong></p>
            </div>
            
            <div class="buttons">
                <button class="btn-start" id="startButton" onclick="startGame()">▶ СТАРТ</button>
                <button class="btn-pause" id="pauseButton" onclick="togglePause()" disabled>⏸ ПАУЗА</button>
                <button class="btn-add" id="addBallButton" onclick="addBall()" disabled>➕ ШАРИК</button>
                <button class="btn-reset" onclick="resetGame()">🔄 ЗАНОВО</button>
                <button class="btn-back" onclick="window.close()">← НАЗАД</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let balls = [];
        let isPaused = false;
        let isGameStarted = false;
        let animationId = null;
        let gameTime = 0;
        let gameTimer = null;
        
        const circleCenter = { x: canvas.width / 2, y: canvas.height / 2 };
        const circleRadius = Math.min(canvas.width, canvas.height) / 2 - 50;
        
        // РАЗНОЦВЕТНЫЕ ШАРИКИ
        const ballColors = [
            '#ff4444', '#4444ff', '#44ff44', '#ffff44',
            '#ff44ff', '#44ffff', '#ff8844', '#8844ff',
            '#ff4488', '#88ff44', '#4488ff', '#ffaa00'
        ];
        
        class TrailSegment {
            constructor(collisionX, collisionY, ballRef) {
                this.collisionX = collisionX;
                this.collisionY = collisionY;
                this.ballRef = ballRef;
                this.width = 4;
                this.life = 1;
                this.isCut = false;
            }
        }

        // Заглушки функций, чтобы код не выдавал ошибку (допиши сюда свою логику игры)
        function startGame() { console.log("Старт игры"); }
        function togglePause() { console.log("Пауза"); }
        function addBall() { console.log("Добавлен шар"); }
        function resetGame() { console.log("Сброс"); }
    </script>
</body>
</html>
