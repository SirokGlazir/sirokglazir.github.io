<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шарики в круге</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            display: flex;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
        }
        .game-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
        }
        #gameCanvas {
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
            background: #0a0a0a;
            border: 2px solid #0f0;
            max-width: 100%;
            height: auto;
            aspect-ratio: 7 / 6;
        }
        .start-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            width: 100%;
        }
        .start-overlay h2 {
            color: #0f0;
            font-size: 24px;
            text-shadow: 0 0 20px #0f0;
        }
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f00;
            font-size: 24px;
            font-weight: bold;
            display: none;
            text-shadow: 0 0 10px #f00;
        }
        .settings-panel {
            width: 280px;
            background: #0a0a0a;
            border: 2px solid #0f0;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
            display: flex;
            flex-direction: column;
        }
        .settings-panel h3 {
            color: #0f0;
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #0f0;
            padding-bottom: 10px;
            font-size: 18px;
        }
        .setting-group { margin-bottom: 12px; }
        .setting-group label {
            color: #0f0;
            font-size: 12px;
            display: block;
            margin-bottom: 3px;
        }
        .setting-group input[type="range"] {
            width: 100%;
            accent-color: #0f0;
        }
        .setting-group span { color: #fff; font-weight: bold; }
        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #0f0;
            font-size: 12px;
        }
        .checkbox-label input {
            margin-right: 6px;
            accent-color: #0f0;
        }
        .stats {
            background: #0a0a0a;
            border: 1px solid #0f0;
            border-radius: 5px;
            padding: 10px;
            margin: 10px 0;
        }
        .stats p { margin: 4px 0; color: #0f0; font-size: 11px; }
        .stats strong { color: #fff; }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }
        button {
            padding: 12px;
            border: 1px solid #0f0;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }
        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #333;
            color: #333;
        }
        .btn-start { background: #0f0; color: #000; }
        .btn-start:hover:not(:disabled) { background: #000; color: #0f0; box-shadow: 0 0 20px #0f0; }
        .btn-pause { background: #0a0a0a; color: #0f0; }
        .btn-pause:hover:not(:disabled) { background: #0f0; color: #000; }
        .btn-add { background: #0a0a0a; color: #0f0; }
        .btn-add:hover:not(:disabled) { background: #0f0; color: #000; }
        .btn-reset { background: #0a0a0a; color: #0f0; }
        .btn-reset:hover:not(:disabled) { background: #0f0; color: #000; }
        .btn-back { background: #0a0a0a; color: #f00; border-color: #f00; }
        .btn-back:hover:not(:disabled) { background: #f00; color: #000; }

        @media screen and (max-width: 850px) {
            body {
                align-items: flex-start;
                overflow-y: auto !important;
            }
            .game-container {
                flex-direction: column !important;
                height: auto !important;
                gap: 15px;
            }
            .game-area {
                width: 100% !important;
            }
            #gameCanvas {
                width: 100% !important;
                max-width: 100% !important;
            }
            .settings-panel {
                width: 100% !important;
                margin-top: 10px;
            }
            .buttons {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                gap: 10px;
            }
            .btn-back {
                grid-column: span 2 !important;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-area">
            <canvas id="gameCanvas" width="700" height="600"></canvas>
            <div class="start-overlay" id="startOverlay">
                <h2>🎮 НАЖМИТЕ "СТАРТ"</h2>
            </div>
            <div class="game-over" id="gameOver">ИГРА ОКОНЧЕНА!</div>
        </div>
        
        <div class="settings-panel">
            <h3>🎮 НАСТРОЙКИ</h3>
            
            <div class="setting-group">
                <label>ШАРОВ: <span id="ballCountValue">5</span></label>
                <input type="range" id="ballCount" min="2" max="12" value="5" step="1">
            </div>
            
            <div class="setting-group">
                <label>РАЗМЕР: <span id="ballSizeValue">15</span></label>
                <input type="range" id="ballSize" min="5" max="30" value="15" step="1">
            </div>
            
            <div class="setting-group">
                <label>СКОРОСТЬ: <span id="baseSpeedValue">3</span></label>
                <input type="range" id="baseSpeed" min="1" max="10" value="3" step="0.5">
            </div>
            
            <div class="setting-group">
                <label>ПРИРОСТ: <span id="speedIncrementValue">0.15</span></label>
                <input type="range" id="speedIncrement" min="0.01" max="0.5" value="0.15" step="0.01">
            </div>
            
            <div class="setting-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="showTrails" checked>
                    СЛЕДЫ
                </label>
            </div>
            
            <div class="setting-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="collisionBetweenBalls" checked>
                    СТОЛКНОВЕНИЯ
                </label>
            </div>
            
            <div class="stats">
                <p>АКТИВНЫХ: <strong id="aliveBalls">0</strong></p>
                <p>СЛЕДОВ: <strong id="totalTrails">0</strong></p>
                <p>ВРЕМЯ: <strong id="gameTime">0:00</strong></p>
                <p>СТАТУС: <strong id="gameStatus">НЕ НАЧАТА</strong></p>
            </div>
            
            <div class="buttons">
                <button class="btn-start" id="startButton" onclick="startGame()">▶ СТАРТ</button>
                <button class="btn-pause" id="pauseButton" onclick="togglePause()" disabled>⏸ ПАУЗА</button>
                <button class="btn-add" id="addBallButton" onclick="addBall()" disabled>➕ ШАРИК</button>
                <button class="btn-reset" onclick="resetGame()">🔄 ЗАНОВО</button>
                <button class="btn-back" onclick="goBackToMenu()">← НАЗАД</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let balls = [];
        let trails = [];
        let isPaused = false;
        let isGameStarted = false;
        let isProtectedTime = false; 
        let animationId = null;
        let totalElapsedSeconds = 0;
        let gameTimer = null;
        
        const circleCenter = { x: canvas.width / 2, y: canvas.height / 2 };
        const circleRadius = Math.min(canvas.width, canvas.height) / 2 - 40;
        
        const ballColors = [
            '#ff4444', '#4444ff', '#44ff44', '#ffff44',
            '#ff44ff', '#44ffff', '#ff8844', '#8844ff',
            '#ff4488', '#88ff44', '#4488ff', '#ffaa00'
        ];

        function handleSliderChange() {
            if (!isGameStarted) {
                initInitialBalls();
                drawInitialState();
            }
        }

        const setupSlider = (id, valueId) => {
            const slider = document.getElementById(id);
            const display = document.getElementById(valueId);
            slider.addEventListener('input', () => {
                display.textContent = slider.value;
                handleSliderChange();
            });
        };
        setupSlider('ballCount', 'ballCountValue');
        setupSlider('ballSize', 'ballSizeValue');
        setupSlider('baseSpeed', 'baseSpeedValue');
        setupSlider('speedIncrement', 'speedIncrementValue');

        // ЧАСТЬ 1: ФИЗИКА ШАРОВ И СИСТЕМА НЕОНОВЫХ СЛЕДОВ
class Ball {
    constructor(x, y, radius, color, vx, vy) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.color = color;
        this.vx = vx;
        this.vy = vy;
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;

        const dx = this.x - circleCenter.x;
        const dy = this.y - circleCenter.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance + this.radius >= circleRadius) {
            const nx = dx / distance;
            const ny = dy / distance;

            // Генерируем след на границе круга
            if (document.getElementById('showTrails').checked) {
                trails.push({
                    x: circleCenter.x + nx * circleRadius,
                    y: circleCenter.y + ny * circleRadius,
                    color: this.color,
                    radius: 4, // Сделали чуть жирнее, чтобы лучше видеть
                    alpha: 1.0
                });
            }

            const dotProduct = this.vx * nx + this.vy * ny;
            this.vx = this.vx - 2 * dotProduct * nx;
            this.vy = this.vy - 2 * dotProduct * ny;

            const inc = parseFloat(document.getElementById('speedIncrement').value);
            const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
            const newSpeed = currentSpeed + inc;
            
            this.vx = (this.vx / currentSpeed) * newSpeed;
            this.vy = (this.vy / currentSpeed) * newSpeed;

            this.x = circleCenter.x + nx * (circleRadius - this.radius - 1);
            this.y = circleCenter.y + ny * (circleRadius - this.radius - 1);
        }
    }
}

function initInitialBalls() {
    const count = parseInt(document.getElementById('ballCount').value);
    const radius = parseInt(document.getElementById('ballSize').value);
    const speed = parseFloat(document.getElementById('baseSpeed').value);

    balls = [];
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i;
        const spawnRadius = 120; 
        const x = circleCenter.x + Math.cos(angle) * spawnRadius;
        const y = circleCenter.y + Math.sin(angle) * spawnRadius;
        
        const moveAngle = Math.random() * Math.PI * 2;
        const vx = Math.cos(moveAngle) * speed;
        const vy = Math.sin(moveAngle) * speed;
        const color = ballColors[i % ballColors.length];

        balls.push(new Ball(x, y, radius, color, vx, vy));
    }
}

function drawInitialState() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.beginPath();
    ctx.arc(circleCenter.x, circleCenter.y, circleRadius, 0, Math.PI * 2);
    ctx.strokeStyle = '#0f0';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.closePath();

    // Рисуем следы, если они есть
    trails.forEach(t => {
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
        ctx.fillStyle = t.color;
        ctx.globalAlpha = t.alpha;
        ctx.fill();
        ctx.closePath();
    });
    ctx.globalAlpha = 1.0;

    balls.forEach(ball => ball.draw());
    document.getElementById('aliveBalls').textContent = balls.length;
}

// ЧАСТЬ 2: ЛОГИКА ДВИЖЕНИЯ, ТАЙМЕРЫ И КНОПКА НАЗАД В ДРУГУЮ ВКЛАДКУ
function checkBallCollisions() {
    if (!document.getElementById('collisionBetweenBalls').checked) return;

    for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
            const b1 = balls[i];
            const b2 = balls[j];
            const dx = b2.x - b1.x;
            const dy = b2.y - b1.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < b1.radius + b2.radius) {
                const nx = dx / dist;
                const ny = dy / dist;
                const kx = b1.vx - b2.vx;
                const ky = b1.vy - b2.vy;
                const p = nx * kx + ny * ky;

                if (p > 0) {
                    b1.vx -= nx * p;
                    b1.vy -= ny * p;
                    b2.vx += nx * p;
                    b2.vy += ny * p;
                }
            }
        }
    }
}

function gameLoop() {
    if (isPaused || !isGameStarted) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.beginPath();
    ctx.arc(circleCenter.x, circleCenter.y, circleRadius, 0, Math.PI * 2);
    ctx.strokeStyle = '#0f0';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.closePath();

    // Обработка следов: уменьшаем альфу только если первые 5 секунд прошли
    for (let i = trails.length - 1; i >= 0; i--) {
        const t = trails[i];
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
        ctx.fillStyle = t.color;
        ctx.globalAlpha = t.alpha;
        ctx.fill();
        ctx.closePath();
        
        if (!isProtectedTime) {
            t.alpha -= 0.005; // Начинают исчезать только после 5-й секунды
            if (t.alpha <= 0) trails.splice(i, 1);
        }
    }
    ctx.globalAlpha = 1.0;

    balls.forEach(ball => {
        ball.update();
        ball.draw();
    });

    checkBallCollisions();

    document.getElementById('aliveBalls').textContent = balls.length;
    document.getElementById('totalTrails').textContent = trails.length;

    animationId = requestAnimationFrame(gameLoop);
}

function updateTimer() {
    totalElapsedSeconds++;
    
    if (totalElapsedSeconds >= 5) {
        isProtectedTime = false;
        document.getElementById('gameStatus').textContent = 'ИГРАЕТ';
    }
    
    const mins = Math.floor(totalElapsedSeconds / 60);
    const secs = totalElapsedSeconds % 60;
    document.getElementById('gameTime').textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

function startGame() {
    if (isGameStarted) return;

    isGameStarted = true;
    isPaused = false;
    isProtectedTime = true; // Защита включена на старте
    
    document.getElementById('startOverlay').style.display = 'none';
    document.getElementById('gameOver').style.display = 'none';
    document.getElementById('gameStatus').textContent = 'ЗАЩИТА (5с)';
    
    document.getElementById('startButton').disabled = true;
    document.getElementById('pauseButton').disabled = false;
    document.getElementById('addBallButton').disabled = false;

    totalElapsedSeconds = 0;
    clearInterval(gameTimer);
    gameTimer = setInterval(updateTimer, 1000);

    gameLoop();
}

function togglePause() {
    if (!isGameStarted) return;
    isPaused = !isPaused;
    
    const btn = document.getElementById('pauseButton');
    if (isPaused) {
        btn.textContent = '▶ ПРОДОЛЖИТЬ';
        document.getElementById('gameStatus').textContent = 'ПАУЗА';
        clearInterval(gameTimer);
        cancelAnimationFrame(animationId);
    } else {
        btn.textContent = '⏸ ПАУЗА';
        document.getElementById('gameStatus').textContent = isProtectedTime ? 'ЗАЩИТА (5с)' : 'ИГРАЕТ';
        gameTimer = setInterval(updateTimer, 1000);
        gameLoop();
    }
}

function resetGame() {
    cancelAnimationFrame(animationId);
    clearInterval(gameTimer);
    isGameStarted = false;
    isPaused = false;
    isProtectedTime = false;
    
    trails = [];
    initInitialBalls();
    drawInitialState();
    
    document.getElementById('startOverlay').style.display = 'block';
    document.getElementById('gameOver').style.display = 'none';
    document.getElementById('gameStatus').textContent = 'НЕ НАЧАТА';
    document.getElementById('gameTime').textContent = '0:00';
    document.getElementById('totalTrails').textContent = '0';
    
    document.getElementById('startButton').disabled = false;
    document.getElementById('pauseButton').disabled = true;
    document.getElementById('addBallButton').disabled = true;
    document.getElementById('pauseButton').textContent = '⏸ ПАУЗА';
}

// НАДЕЖНОЕ ЗАКРЫТИЕ ОТДЕЛЬНОЙ ВКЛАДКИ
function goBackToMenu() {
    cancelAnimationFrame(animationId);
    clearInterval(gameTimer);
    
    // Браузер разрешает закрыть вкладку через скрипт только если она была создана через target="_blank"
    window.close();
}

window.onload = function() {
    initInitialBalls();
    drawInitialState();
};
</script>
</body>
</html>
